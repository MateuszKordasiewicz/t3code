trigger: none
pr: none

# Azure cron uses UTC. The prepare job selects the New York offset for that run.
schedules:
  - cron: "0 7 * * *"
    displayName: Eastern daylight time
    branches:
      include: [main]
    always: true
  - cron: "0 8 * * *"
    displayName: Eastern standard time
    branches:
      include: [main]
    always: true

parameters:
  - name: dryRun
    displayName: Dry run (compute the merge without publishing a branch)
    type: boolean
    default: true
  - name: trialTarget
    displayName: Disposable target suffix under sync/azure-upstream-trial/
    type: string
    default: none
  - name: trialBase
    displayName: Expected Azure target SHA for a disposable trial
    type: string
    default: none
  - name: trialUpstream
    displayName: Pinned GitHub upstream SHA for a disposable trial
    type: string
    default: none
  - name: trialMode
    displayName: Disposable trial mode
    type: string
    default: repair
    values: [repair, invalid, timeout]

pool: { vmImage: ubuntu-24.04 }

variables:
  runNumber: $(Build.BuildId)
  T3CODE_TELEMETRY_CHANNEL: dev
  repairNeeded: "false"
  syncDir: $(Agent.TempDirectory)/upstream-sync

stages:
  - stage: UpstreamSync
    displayName: Sync upstream
    condition: or(ne(variables['Build.Reason'], 'Schedule'), eq(variables['UPSTREAM_SYNC_SCHEDULE_ENABLED'], 'true'))
    jobs:
      - job: Prepare
        displayName: Check upstream and prepare candidate
        timeoutInMinutes: 55
        cancelTimeoutInMinutes: 6
        steps:
          - checkout: self
            fetchDepth: 0
            fetchTags: false
          - bash: bash azure-pipelines/upstream-sync.sh prepare
            displayName: Merge the exact target and upstream
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              DRY_RUN: ${{ parameters.dryRun }}
              CRON_SCHEDULE: $(Build.CronSchedule.DisplayName)
              VM_REPAIR_ENABLED: $(UPSTREAM_SYNC_VM_REPAIR_ENABLED)
              SYNC_DIR: $(syncDir)
              TRIAL_TARGET: ${{ parameters.trialTarget }}
              TRIAL_BASE: ${{ parameters.trialBase }}
              TRIAL_UPSTREAM: ${{ parameters.trialUpstream }}
              TRIAL_MODE: ${{ parameters.trialMode }}
          - publish: $(syncDir)/artifact
            artifact: upstream-repair-input-$(System.JobAttempt)
            displayName: Pin the pilot's Git inputs
            condition: and(succeeded(), eq(variables['repairNeeded'], 'true'))
          - bash: bash azure-pipelines/upstream-sync.sh acquire-pilot
            displayName: Reserve the pilot for this sync
            condition: and(succeeded(), eq(variables['repairNeeded'], 'true'))
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              SYNC_DIR: $(syncDir)
          - task: AzureCLI@2
            displayName: Run one bounded T3 repair on the pilot
            condition: and(succeeded(), eq(variables['repairNeeded'], 'true'))
            inputs:
              azureSubscription: t3-private-pilot-vm
              visibleAzLogin: false
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: exec python3 azure-pipelines/upstream-sync-vm.py repair
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              SYNC_DIR: $(syncDir)
              TRIAL_MODE: ${{ parameters.trialMode }}
          - task: AzureCLI@2
            displayName: Deallocate the pilot if repair was interrupted
            condition: and(always(), eq(variables['repairNeeded'], 'true'), ne(variables['pilotClean'], 'true'), eq(variables['pilotReserved'], 'true'))
            inputs:
              azureSubscription: t3-private-pilot-vm
              visibleAzLogin: false
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: exec python3 azure-pipelines/upstream-sync-vm.py cleanup
            env:
              SYNC_DIR: $(syncDir)
          - bash: bash azure-pipelines/upstream-sync.sh release-pilot
            displayName: Release the pilot reservation
            condition: and(always(), eq(variables['repairNeeded'], 'true'))
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              SYNC_DIR: $(syncDir)
          - bash: bash azure-pipelines/upstream-sync.sh publish
            name: candidate
            displayName: Verify and publish the candidate branch
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              SYNC_DIR: $(syncDir)
              TRIAL_TARGET: ${{ parameters.trialTarget }}
              TRIAL_BASE: ${{ parameters.trialBase }}
              TRIAL_UPSTREAM: ${{ parameters.trialUpstream }}
              TRIAL_MODE: ${{ parameters.trialMode }}

      - job: Validate
        displayName: Build and smoke-test the candidate
        dependsOn: Prepare
        condition: and(succeeded(), ne(dependencies.Prepare.outputs['candidate.commit'], ''))
        timeoutInMinutes: 60
        variables:
          candidateCommit: $[dependencies.Prepare.outputs['candidate.commit']]
          candidateRef: $[dependencies.Prepare.outputs['candidate.ref']]
        steps:
          - checkout: self
            fetchDepth: 1
            fetchTags: false
          - bash: |
              set -euo pipefail
              git -c "http.extraheader=AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN" \
                fetch --no-tags --depth=1 origin "$CANDIDATE_REF"
              test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_COMMIT"
              git checkout --detach "$CANDIDATE_COMMIT"
              echo "Building exact candidate $CANDIDATE_COMMIT"
            displayName: Check out the exact candidate
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              CANDIDATE_COMMIT: $(candidateCommit)
              CANDIDATE_REF: $(candidateRef)
          - template: linux-server-steps.yml
            parameters:
              sourceCommit: $(candidateCommit)
              sourceRef: $(candidateRef)

      - job: OpenPullRequest
        displayName: Open protected pull request
        dependsOn: [Prepare, Validate]
        condition: and(succeeded(), eq(dependencies.Validate.result, 'Succeeded'))
        timeoutInMinutes: 5
        variables:
          candidateCommit: $[dependencies.Prepare.outputs['candidate.commit']]
          candidateRef: $[dependencies.Prepare.outputs['candidate.ref']]
          candidateBase: $[dependencies.Prepare.outputs['candidate.base']]
          candidateTree: $[dependencies.Prepare.outputs['candidate.tree']]
          upstreamCommit: $[dependencies.Prepare.outputs['candidate.upstream']]
        steps:
          - checkout: self
            fetchDepth: 1
            fetchTags: false
          - bash: bash azure-pipelines/upstream-sync.sh open-pr
            displayName: Open PR for the validated candidate
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              CANDIDATE_COMMIT: $(candidateCommit)
              CANDIDATE_REF: $(candidateRef)
              CANDIDATE_BASE: $(candidateBase)
              CANDIDATE_TREE: $(candidateTree)
              UPSTREAM_COMMIT: $(upstreamCommit)
              TRIAL_TARGET: ${{ parameters.trialTarget }}
              TRIAL_BASE: ${{ parameters.trialBase }}
              TRIAL_UPSTREAM: ${{ parameters.trialUpstream }}
              TRIAL_MODE: ${{ parameters.trialMode }}
