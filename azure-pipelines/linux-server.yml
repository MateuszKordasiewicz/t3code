# Insta Blinds fork: builds the self-contained Linux x64 T3 server archive
# (t3-<version>-linux-x64.tar.gz), smoke-tests it, and publishes it with
# SHA256SUMS and build-info.json as the pipeline artifact "t3-linux-server".
# Mirrors the Linux CLI-archive steps of .github/workflows/release.yml and
# release-desktop.yml. Kept outside .github/ so upstream merges never conflict.
# Azure DevOps pipeline: Instablinds/t3code -> t3code-linux-server.

# Every merge to main builds; manual runs work on any branch. batch: merges that
# land during a run share one follow-up build, since the org's 2 hosted parallel
# jobs are shared with other projects.
trigger:
  batch: true
  branches:
    include: [main]
pr: none

schedules:
  - cron: "0 10 * * *"
    displayName: Nightly Linux server build
    branches:
      include: [main]
    always: true

# The only line to change for a self-hosted pool: pool: { name: <pool> }.
# Any agent must be Ubuntu 24.04 (node-pty's glibc ceiling, scripts/linux-glibc.ts)
# with passwordless sudo for apt, and about 6 GB of free disk.
pool: { vmImage: ubuntu-24.04 }

variables:
  # Increases by one per run of this pipeline; becomes the last version field.
  runNumber: $[counter('t3code-linux-server', 1)]
  T3CODE_TELEMETRY_CHANNEL: dev

jobs:
  - job: linux_server
    displayName: Build Linux server archive
    timeoutInMinutes: 60
    steps:
      - checkout: self
        fetchDepth: 2

      - bash: bash azure-pipelines/verify-upstream-merge.sh
        displayName: Verify the upstream candidate and target
        condition: |
          and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'),
              startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/sync/azure-upstream/'))

      - template: linux-server-steps.yml
