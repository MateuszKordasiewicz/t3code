# Fork-only: the Linux desktop app for MateuszKordasiewicz/t3code. Each push to
# main publishes a nightly-shaped prerelease whose app updates from this fork's
# releases, never from pingdotgg/t3code. Upstream's release.yml only runs in
# pingdotgg/t3code. A pull request that changes this file builds without publishing.
name: Fork Release Linux

on:
  push:
    branches: [main]
  pull_request:
    paths: [.github/workflows/fork-release-linux.yml]
  workflow_dispatch:

permissions:
  contents: read

# Releases publish in push order, so a newer version never lands before an older one.
concurrency:
  group: fork-release-linux-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Build and publish Linux AppImage
    if: github.repository == 'MateuszKordasiewicz/t3code'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: MateuszKordasiewicz/t3code
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Resolve fork nightly version
        id: version
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          node scripts/resolve-nightly-release.ts \
            --date "$(date -u +%Y%m%d)" \
            --run-number "$RUN_NUMBER" \
            --sha "$SHA" \
            --github-output
          cat "$GITHUB_OUTPUT"

      # The same public T3 Connect settings upstream's preview builds read.
      - name: Load T3 Connect public config
        shell: bash
        run: |
          for key in CLERK_PUBLISHABLE_KEY CLERK_JWT_TEMPLATE CLERK_CLI_OAUTH_CLIENT_ID RELAY_URL; do
            value="$(sed -n "s|^T3CODE_${key}=||p" .env.example)"
            if [[ -z "$value" ]]; then
              echo "Missing T3CODE_${key} in .env.example" >&2
              exit 1
            fi
            echo "T3CODE_${key}=$value" >> "$GITHUB_ENV"
          done

      - name: Install Linux desktop build libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config libgtk-3-0t64 libnss3 libasound2t64 libgbm1 imagemagick

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache Linux packaging tool archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron-builder/appimage@*/appimage-tools-runtime-*.tar.gz
            ~/.cache/electron-builder/fpm@*/fpm-*.7z
            ~/.cache/electron-builder/7zip@*/7zip-linux-*.tar.gz
          key: electron-builder-linux-tools-x64-${{ hashFiles('node_modules/.pnpm/app-builder-lib@*/node_modules/app-builder-lib/out/toolsets/linux.js', 'node_modules/.pnpm/app-builder-lib@*/node_modules/app-builder-lib/out/toolsets/7zip.js') }}

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      - name: Build desktop AppImage
        run: >-
          vp run dist:desktop:artifact
          --platform linux --target AppImage --arch x64
          --build-version "${{ steps.version.outputs.version }}"
          --verbose

      - name: Check update feed and collect assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ls -la release
          manifest=(release/nightly-linux.yml)
          appimage=(release/*.AppImage)
          if [[ ! -f "${manifest[0]}" || ${#appimage[@]} -ne 1 ]]; then
            echo "Expected one AppImage and release/nightly-linux.yml" >&2
            exit 1
          fi
          grep -q "version: ${{ steps.version.outputs.version }}" "${manifest[0]}"
          mkdir assets
          cp release/*.AppImage release/*.blockmap release/*.yml assets/
          (cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Upload build (pull request)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-linux-${{ steps.version.outputs.version }}
          path: assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # Created as a draft so the updater never sees a release whose files are still uploading.
      - name: Publish fork release
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" assets/* \
            --draft --prerelease --latest=false \
            --target "$SHA" \
            --title "T3 Code Fork nightly $VERSION ($SHORT_SHA)" \
            --notes "Fork build of MateuszKordasiewicz/t3code main at $SHA. This app updates only from this fork's releases."
          gh release edit "$TAG" --draft=false
