# Fork-only: the Linux desktop app for MateuszKordasiewicz/t3code. Each push to
# main publishes a nightly-shaped prerelease whose app updates from this fork's
# releases, never from pingdotgg/t3code. Upstream's release.yml only runs in
# pingdotgg/t3code. A pull request that changes this file builds without publishing.
name: Fork Release Linux

on:
  push:
    branches: [main]
  pull_request:
    paths: [.github/workflows/fork-release-linux.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux AppImage
    if: github.repository == 'MateuszKordasiewicz/t3code'
    # 24.04, not ubuntu-latest: node-pty compiles here and must stay within scripts/linux-glibc.ts's glibc ceiling.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    # Only a pull request's newer push cancels its older build; every other run builds.
    concurrency:
      group: fork-release-linux-build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: MateuszKordasiewicz/t3code
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Resolve fork nightly version
        id: version
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        # The commit's date, not the clock, so re-running a run cannot rank an old commit above newer releases.
        run: |
          # Azure reserves larger run numbers for its releases.
          test "$RUN_NUMBER" -lt 1000000000
          node scripts/resolve-nightly-release.ts \
            --date "$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d "$SHA")" \
            --run-number "$RUN_NUMBER" \
            --sha "$SHA" \
            --github-output
          cat "$GITHUB_OUTPUT"

      # The same public T3 Connect settings upstream's preview builds read.
      - name: Load T3 Connect public config
        shell: bash
        run: |
          for key in CLERK_PUBLISHABLE_KEY CLERK_JWT_TEMPLATE CLERK_CLI_OAUTH_CLIENT_ID RELAY_URL; do
            value="$(sed -n "s|^T3CODE_${key}=||p" .env.example)"
            if [[ -z "$value" ]]; then
              echo "Missing T3CODE_${key} in .env.example" >&2
              exit 1
            fi
            echo "T3CODE_${key}=$value" >> "$GITHUB_ENV"
          done

      - name: Install Linux desktop build libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config libgtk-3-0t64 libnss3 libasound2t64 libgbm1 imagemagick

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache Linux packaging tool archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron-builder/appimage@*/appimage-tools-runtime-*.tar.gz
            ~/.cache/electron-builder/fpm@*/fpm-*.7z
            ~/.cache/electron-builder/7zip@*/7zip-linux-*.tar.gz
          key: electron-builder-linux-tools-x64-${{ hashFiles('node_modules/.pnpm/app-builder-lib@*/node_modules/app-builder-lib/out/toolsets/linux.js', 'node_modules/.pnpm/app-builder-lib@*/node_modules/app-builder-lib/out/toolsets/7zip.js') }}

      - name: Build desktop AppImage
        run: >-
          vp run dist:desktop:artifact
          --platform linux --target AppImage --arch x64
          --build-version "${{ steps.version.outputs.version }}"
          --verbose

      - name: Check update feed and collect assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ls -la release
          manifest=(release/nightly-linux.yml)
          appimage=(release/*.AppImage)
          if [[ ! -f "${manifest[0]}" || ${#appimage[@]} -ne 1 ]]; then
            echo "Expected one AppImage and release/nightly-linux.yml" >&2
            exit 1
          fi
          grep -q "version: ${{ steps.version.outputs.version }}" "${manifest[0]}"
          ASSETS="$RUNNER_TEMP/fork-release-assets"
          echo "ASSETS=$ASSETS" >> "$GITHUB_ENV"
          mkdir -p "$ASSETS"
          cp "${appimage[0]}" "${manifest[0]}" release/*.blockmap "$ASSETS/"
          (cd "$ASSETS" && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-linux-${{ steps.version.outputs.version }}
          path: ${{ env.ASSETS }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          # "Re-run all jobs" uploads again under the same run.
          overwrite: true

  # Only this job has write access. It runs the shared publisher from main without build dependencies.
  publish:
    name: Publish fork release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Every main run publishes, one at a time; none replaces a pending one.
    concurrency:
      group: fork-release-linux-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Checkout release publisher
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        # actions/checkout's credential cleanup fails on the orphaned .repos gitlinks.
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set azure-pipelines
          git checkout --detach FETCH_HEAD

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-linux-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/assets

      - name: Publish fork release and update feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash azure-pipelines/publish-fork-linux.sh "$TAG" "$GITHUB_SHA" "github-$GITHUB_RUN_ID" "$RUNNER_TEMP/assets"
